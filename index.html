<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سراجنا - القرآن الكريم</title>
  
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #2c3e50;
      --accent-color: #007bc7;
      --accent-hover: #005a93;
      --border-color: #e0e0e0;
      --fav-color: #e74c3c;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }

    body.dark-mode {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #e0e0e0;
      --accent-color: #64b5f6;
      --accent-hover: #9be7ff;
      --border-color: #333333;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    a {
      color: var(--accent-color);
      text-decoration: none;
      font-weight: 600;
    }

    a:hover {
      color: var(--accent-hover);
      text-decoration: underline;
    }

    header {
      width: 100%;
      max-width: 600px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--accent-color);
    }

    .icon-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      box-shadow: var(--shadow);
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 25px;
      width: 100%;
      max-width: 600px;
      box-shadow: var(--shadow);
      text-align: center;
    }

    /* اختيار السورة والشيخ */
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .select-box {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--card-bg);
      color: var(--text-color);
      font-size: 0.95rem;
      outline: none;
    }

    .surah-title {
      font-size: 1.6rem;
      margin: 15px 0;
      color: var(--accent-color);
      font-weight: bold;
    }

    .audio-section {
      margin: 20px 0;
      width: 100%;
    }

    audio {
      width: 100%;
      border-radius: 30px;
      outline: none;
    }

    .action-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 20px;
    }

    .action-btn {
      padding: 10px 20px;
      border: 1px solid var(--border-color);
      border-radius: 25px;
      background: transparent;
      color: var(--text-color);
      cursor: pointer;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .action-btn:hover {
      border-color: var(--accent-color);
    }

    .fav-btn.active {
      color: var(--fav-color);
      border-color: var(--fav-color);
      background-color: rgba(231, 76, 60, 0.08);
    }

    footer {
      margin-top: auto;
      padding-top: 30px;
      font-size: 0.9rem;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">سراجنا</div>
    <button class="icon-btn" onclick="toggleDarkMode()">🌙 الوضع</button>
  </header>

  <main class="card">
    
    <!-- خيارات القارئ والسورة -->
    <div class="controls-grid">
      <div>
        <label style="display:block; margin-bottom:5px; font-size:0.85rem;">اختر القارئ:</label>
        <select id="reciterSelect" class="select-box" onchange="updateAudio()">
          <option value="https://server12.mp3quran.net/maher/">ماهر المعيقلي</option>
          <option value="https://server8.mp3quran.net/abbaa/">فارس عباد</option>
        </select>
      </div>

      <div>
        <label style="display:block; margin-bottom:5px; font-size:0.85rem;">اختر السورة:</label>
        <select id="surahSelect" class="select-box" onchange="updateAudio()">
          <!-- سيتم إضافة الـ 114 سورة تلقائياً من الجافاسكريبت -->
        </select>
      </div>
    </div>

    <!-- اسم السورة المعروضة -->
    <div class="surah-title" id="surahNameDisplay">سورة الفاتحة</div>

    <!-- مشغل الصوتيات -->
    <div class="audio-section">
      <audio id="audioPlayer" controls>
        <source id="audioSource" src="" type="audio/mpeg">
        متصفحك لا يدعم مشغل الصوتيات.
      </audio>
    </div>

    <!-- أزرار المفضلة والمشاركة -->
    <div class="action-buttons">
      <button id="favBtn" class="action-btn fav-btn" onclick="toggleFavorite()">
        <span class="icon">🤍</span> <span id="favText">المفضلة</span>
      </button>

      <button class="action-btn share-btn" onclick="shareContent()">
        <span class="icon">📤</span> مشاركة
      </button>
    </div>

  </main>

  <footer>
    تم التطوير بـ ❤️ | <a href="https://github.com" target="_blank">رابط المشروع</a>
  </footer>

  <script>
    // قائمة أسماء سور القرآن الكريم كاملاً (114 سورة)
    const surahs = [
      "الفاتحة", "البقرة", "آل عمران", "النساء", "المائدة", "الأنعام", "الأعراف", "الأنفال", "التوبة", "يونس",
      "هود", "يوسف", "الرعد", "إبراهيم", "الحجر", "النحل", "الإسراء", "الكهف", "مريم", "طه",
      "الأنبياء", "الحج", "المؤمنون", "النور", "الفرقان", "الشعراء", "النمل", "القصص", "العنكبوت", "الروم",
      "لقمان", "السجدة", "الأحزاب", "سبأ", "فاطر", "يس", "الصافات", "ص", "الزمر", "غافر",
      "فصلت", "الشورى", "الزخرف", "الدخان", "الجاثية", "الأحقاف", "محمد", "الفتح", "الحجرات", "ق",
      "الذاريات", "الطور", "النجم", "القمر", "الرحمن", "الواقعة", "الحديد", "المجادلة", "الحشر", "الممتحنة",
      "الصف", "الجمعة", "المنافقون", "التغابن", "الطلاق", "التحريم", "الملك", "القلم", "الحاقة", "المعارج",
      "نوح", "الجن", "المزمل", "المدثر", "القيامة", "الإنسان", "المرسلات", "النبأ", "النازعات", "عبس",
      "التكوير", "الإنفطار", "المطففين", "الإنشقاق", "البروج", "الطارق", "الأعلى", "الغاشية", "الفجر", "البلد",
      "الشمس", "الليل", "الضحى", "الشرح", "التين", "العلق", "القدر", "البينة", "الزلزلة", "العاديات",
      "القارعة", "التكاثر", "العصر", "الهمزة", "الفيلم", "قريش", "المواعون", "الكوثر", "الكافرون", "النصر",
      "المسد", "الإخلاص", "الفلق", "الناس"
    ];

    // تعبئة قائمة السور برمجياً
    const surahSelect = document.getElementById('surahSelect');
    surahs.forEach((surah, index) => {
      let option = document.createElement('option');
      let surahNumber = (index + 1).toString().padStart(3, '0'); // لتحويل 1 إلى 001
      option.value = surahNumber;
      option.textContent = `${index + 1}. ${surah}`;
      surahSelect.appendChild(option);
    });

    // 1. تحديث مشغل الصوتيات
    function updateAudio() {
      const reciterUrl = document.getElementById('reciterSelect').value;
      const selectedSurahNum = document.getElementById('surahSelect').value;
      const selectedSurahIndex = parseInt(selectedSurahNum) - 1;
      
      const audioUrl = `${reciterUrl}${selectedSurahNum}.mp3`;
      const player = document.getElementById('audioPlayer');
      const source = document.getElementById('audioSource');
      
      document.getElementById('surahNameDisplay').textContent = `سورة ${surahs[selectedSurahIndex]}`;
      
      source.src = audioUrl;
      player.load();
      checkFavoriteStatus();
    }

    // 2. نظام الوضع الداكن
    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      localStorage.setItem('sirajna_theme', isDark ? 'dark' : 'light');
    }

    if (localStorage.getItem('sirajna_theme') === 'dark') {
      document.body.classList.add('dark-mode');
    }

    // 3. نظام المفضلة
    function getCurrentItemID() {
      const reciter = document.getElementById('reciterSelect').value.includes('maher') ? 'maher' : 'faras';
      const surah = document.getElementById('surahSelect').value;
      return `${reciter}_${surah}`;
    }

    function checkFavoriteStatus() {
      const itemID = getCurrentItemID();
      let favorites = JSON.parse(localStorage.getItem('sirajna_favs')) || [];
      const favBtn = document.getElementById('favBtn');
      const favText = document.getElementById('favText');
      
      if (favorites.includes(itemID)) {
        favBtn.classList.add('active');
        favBtn.querySelector('.icon').textContent = '❤️';
        favText.textContent = 'في المفضلة';
      } else {
        favBtn.classList.remove('active');
        favBtn.querySelector('.icon').textContent = '🤍';
        favText.textContent = 'المفضلة';
      }
    }

    function toggleFavorite() {
      const itemID = getCurrentItemID();
      let favorites = JSON.parse(localStorage.getItem('sirajna_favs')) || [];
      const index = favorites.indexOf(itemID);

      if (index === -1) {
        favorites.push(itemID);
      } else {
        favorites.splice(index, 1);
      }

      localStorage.setItem('sirajna_favs', JSON.stringify(favorites));
      checkFavoriteStatus();
    }

    // 4. نظام المشاركة
    async function shareContent() {
      const surahName = document.getElementById('surahNameDisplay').innerText;
      const reciterText = document.getElementById('reciterSelect').options[document.getElementById('reciterSelect').selectedIndex].text;
      
      const shareData = {
        title: 'سراجنا',
        text: `استمع إلى ${surahName} بصوت القارئ ${reciterText} عبر موقع سراجنا`,
        url: window.location.href
      };

      if (navigator.share) {
        try { await navigator.share(shareData); } catch (err) {}
      } else {
        navigator.clipboard.writeText(`${shareData.text}\n${window.location.href}`);
        alert('تم نسخ رابط السورة للحافظة بنجاح!');
      }
    }

    // تشغيل الصوت الأول فور التحميل
    document.addEventListener('DOMContentLoaded', updateAudio);
  </script>

</body>
</html>
