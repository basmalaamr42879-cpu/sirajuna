<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سراجنا</title>
  
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #2c3e50;
      --accent-color: #007bc7;
      --accent-hover: #005a93;
      --border-color: #e0e0e0;
      --fav-color: #e74c3c;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }

    body.dark-mode {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #e0e0e0;
      --accent-color: #64b5f6;
      --accent-hover: #9be7ff;
      --border-color: #333333;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background-color 0.3s, color 0.3s;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      width: 100%;
      max-width: 600px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--accent-color);
    }

    .icon-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
    }

    .nav-tabs {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 600px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    .tab-btn {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      font-weight: 600;
    }

    .tab-btn.active {
      background-color: var(--accent-color);
      color: #fff;
      border-color: var(--accent-color);
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 25px;
      width: 100%;
      max-width: 600px;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .select-box {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--card-bg);
      color: var(--text-color);
      outline: none;
    }

    .content-title {
      font-size: 1.5rem;
      margin: 15px 0;
      color: var(--accent-color);
      font-weight: bold;
    }

    .text-box {
      font-size: 1.1rem;
      line-height: 1.8;
      margin: 15px 0;
      background: rgba(0, 0, 0, 0.02);
      padding: 15px;
      border-radius: 10px;
    }

    body.dark-mode .text-box {
      background: rgba(255, 255, 255, 0.05);
    }

    audio {
      width: 100%;
      margin: 15px 0;
    }

    .counter-circle {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background-color: var(--accent-color);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2.5rem;
      margin: 20px auto;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .counter-btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: transparent;
      color: var(--text-color);
      cursor: pointer;
    }

    .prayer-list {
      list-style: none;
      margin-top: 15px;
    }

    .prayer-item {
      display: flex;
      justify-content: space-between;
      padding: 10px;
      border-bottom: 1px solid var(--border-color);
    }

    .action-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 20px;
    }

    .action-btn {
      padding: 10px 20px;
      border: 1px solid var(--border-color);
      border-radius: 25px;
      background: transparent;
      color: var(--text-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .fav-btn.active {
      color: var(--fav-color);
      border-color: var(--fav-color);
    }

    footer {
      margin-top: auto;
      padding-top: 30px;
      font-size: 0.9rem;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">سراجنا</div>
    <button class="icon-btn" onclick="toggleDarkMode()">🌙 الوضع</button>
  </header>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('quran', event)">📖 القرآن</button>
    <button class="tab-btn" onclick="switchTab('azkar', event)">📿 الأذكار الصوتية</button>
    <button class="tab-btn" onclick="switchTab('tasbeeh', event)">🔢 السبحة</button>
    <button class="tab-btn" onclick="switchTab('prayers', event)">🕌 مواقيت الصلاة</button>
  </div>

  <main class="card">
    
    <!-- 1. قسم القرآن الكريم -->
    <div id="quran" class="tab-content active">
      <div class="controls-grid">
        <div>
          <label style="font-size: 0.8rem;">القارئ:</label>
          <select id="reciterSelect" class="select-box" onchange="updateAudio()">
            <option value="https://server12.mp3quran.net/maher/">ماهر المعيقلي</option>
            <option value="https://server8.mp3quran.net/frs_a/">فارس عباد</option>
          </select>
        </div>
        <div>
          <label style="font-size: 0.8rem;">السورة:</label>
          <select id="surahSelect" class="select-box" onchange="updateAudio()"></select>
        </div>
      </div>
      <div class="content-title" id="surahNameDisplay">سورة الفاتحة</div>
      <audio id="audioPlayer" controls><source id="audioSource" src="" type="audio/mpeg"></audio>
    </div>

    <!-- 2. قسم الأذكار الصوتية والنصية -->
    <div id="azkar" class="tab-content">
      <select id="azkarSelect" class="select-box" onchange="updateAzkar()">
        <option value="sabah">أذكار الصباح (مشاري العفاسي)</option>
        <option value="massa">أذكار المساء (مشاري العفاسي)</option>
        <option value="sleep">أذكار النوم (مشاري العفاسي)</option>
      </select>
      <div class="content-title" id="azkarTitle">أذكار الصباح</div>
      <div class="text-box" id="azkarText">"أصبحنا وأصبح الملك لله، والحمد لله ولا إله إلا الله وحده لا شريك له..."</div>
      <audio id="azkarAudio" controls><source id="azkarAudioSource" src="" type="audio/mpeg"></audio>
    </div>

    <!-- 3. قسم السبحة الإلكترونية -->
    <div id="tasbeeh" class="tab-content">
      <div class="content-title">السبحة الإلكترونية</div>
      <select id="tasbeehType" class="select-box">
        <option>سبحان الله وبحمده</option>
        <option>أستغفر الله وأتوب إليه</option>
        <option>الحمد لله</option>
        <option>لا إله إلا الله</option>
      </select>
      <div class="counter-circle" id="counterDisplay" onclick="incrementCounter()">0</div>
      <button class="counter-btn" onclick="resetCounter()">تصفير العداد 🔄</button>
    </div>

    <!-- 4. قسم مواقيت الصلاة والتذكير -->
    <div id="prayers" class="tab-content">
      <div class="content-title">مواقيت الصلاة اليوم</div>
      <p id="locationText" style="font-size: 0.9rem;">جاري تحديد الموقع...</p>
      <ul class="prayer-list" id="prayerTimesList">
        <li class="prayer-item"><span>الفجر</span><span id="fajr">--:--</span></li>
        <li class="prayer-item"><span>الشروق</span><span id="sunrise">--:--</span></li>
        <li class="prayer-item"><span>الظهر</span><span id="dhuhr">--:--</span></li>
        <li class="prayer-item"><span>العصر</span><span id="asr">--:--</span></li>
        <li class="prayer-item"><span>المغرب</span><span id="maghrib">--:--</span></li>
        <li class="prayer-item"><span>العشاء</span><span id="isha">--:--</span></li>
      </ul>
    </div>

    <!-- أزرار المشاركة والمفضلة العامة -->
    <div class="action-buttons">
      <button id="favBtn" class="action-btn fav-btn" onclick="toggleFavorite()">
        <span class="icon">🤍</span> <span id="favText">المفضلة</span>
      </button>
      <button class="action-btn" onclick="shareContent()">
        <span class="icon">📤</span> مشاركة
      </button>
    </div>

  </main>

  <footer>تم التطوير بـ ❤️ | سراجنا</footer>

  <script>
    function switchTab(tabId, event) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      event.target.classList.add('active');
    }

    // 1. القرآن الكريم
    const surahs = ["الفاتحة", "البقرة", "آل عمران", "النساء", "المائدة", "الأنعام", "الأعراف", "الأنفال", "التوبة", "يونس", "هود", "يوسف", "الرعد", "إبراهيم", "الحجر", "النحل", "الإسراء", "الكهف", "مريم", "طه", "الأنبياء", "الحج", "المؤمنون", "النور", "الفرقان", "الشعراء", "النمل", "القصص", "العنكبوت", "الروم", "لقمان", "السجدة", "الأحزاب", "سبأ", "فاطر", "يس", "الصافات", "ص", "الزمر", "غافر", "فصلت", "الشورى", "الزخرف", "الدخان", "الجاثية", "الأحقاف", "محمد", "الفتح", "الحجرات", "ق", "الذاريات", "الطور", "النجم", "القمر", "الرحمن", "الواقعة", "الحديد", "المجادلة", "الحشر", "الممتحنة", "الصف", "الجمعة", "المنافقون", "التغابن", "الطلاق", "التحريم", "الملك", "القلم", "الحاقة", "المعارج", "نوح", "الجن", "المزمل", "المدثر", "القيامة", "الإنسان", "المرسلات", "النبأ", "النازعات", "عبس", "التكوير", "الإنفطار", "المطففين", "الإنشقاق", "البروج", "الطارق", "الأعلى", "الغاشية", "الفجر", "البلد", "الشمس", "الليل", "الضحى", "الشرح", "التين", "العلق", "القدر", "البينة", "الزلزلة", "العاديات", "القارعة", "التكاثر", "العصر", "الهمزة", "الفيلم", "قريش", "المواعون", "الكوثر", "الكافرون", "النصر", "المسد", "الإخلاص", "الفلق", "الناس"];

    const surahSelect = document.getElementById('surahSelect');
    surahs.forEach((surah, i) => {
      let opt = document.createElement('option');
      opt.value = (i + 1).toString().padStart(3, '0');
      opt.textContent = `${i + 1}. ${surah}`;
      surahSelect.appendChild(opt);
    });

    function updateAudio() {
      const reciter = document.getElementById('reciterSelect').value;
      const surah = document.getElementById('surahSelect').value;
      document.getElementById('surahNameDisplay').textContent = `سورة ${surahs[parseInt(surah)-1]}`;
      document.getElementById('audioSource').src = `${reciter}${surah}.mp3`;
      document.getElementById('audioPlayer').load();
    }

    // 2. الأذكار الصوتية الصحيحة
    const azkarData = {
      sabah: {
        title: "أذكار الصباح",
        text: "أصبحنا وأصبح الملك لله، والحمد لله، لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير.",
        audio: "https://archive.org/download/Azkars-Alafasy/01-أذكار%20الصباح.mp3"
      },
      massa: {
        title: "أذكار المساء",
        text: "أمسينا وأمسى الملك لله، والحمد لله، لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير.",
        audio: "https://archive.org/download/Azkars-Alafasy/02-أذكار%20المساء.mp3"
      },
      sleep: {
        title: "أذكار النوم",
        text: "باسمك ربي وضعت جنبي وبك أرفعه، إن أمسكت نفسي فارحمها، وإن أرسلتها فاحفظها بما تحفظ به عبادك الصالحين.",
        audio: "https://archive.org/download/Azkars-Alafasy/03-أذكار%20النوم.mp3"
      }
    };

    function updateAzkar() {
      const type = document.getElementById('azkarSelect').value;
      const data = azkarData[type];
      document.getElementById('azkarTitle').textContent = data.title;
      document.getElementById('azkarText').textContent = data.text;
      document.getElementById('azkarAudioSource').src = data.audio;
      document.getElementById('azkarAudio').load();
    }

    // 3. السبحة
    let count = parseInt(localStorage.getItem('sirajna_counter')) || 0;
    document.getElementById('counterDisplay').textContent = count;

    function incrementCounter() {
      count++;
      document.getElementById('counterDisplay').textContent = count;
      localStorage.setItem('sirajna_counter', count);
    }

    function resetCounter() {
      count = 0;
      document.getElementById('counterDisplay').textContent = count;
      localStorage.setItem('sirajna_counter', count);
    }

    // 4. مواقيت الصلاة
    function fetchPrayerTimes() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          document.getElementById('locationText').textContent = "تم تحديد موقعك بنجاح ✅";

          fetch(`https://api.aladhan.com/v1/timings?latitude=${lat}&longitude=${lng}&method=5`)
            .then(res => res.json())
            .then(data => {
              const times = data.data.timings;
              document.getElementById('fajr').textContent = times.Fajr;
              document.getElementById('sunrise').textContent = times.Sunrise;
              document.getElementById('dhuhr').textContent = times.Dhuhr;
              document.getElementById('asr').textContent = times.Asr;
              document.getElementById('maghrib').textContent = times.Maghrib;
              document.getElementById('isha').textContent = times.Isha;
            });
        }, () => {
          document.getElementById('locationText').textContent = "مواقيت الصلاة (مكة المكرمة)";
          fetchPrayerTimesDefault();
        });
      } else {
        fetchPrayerTimesDefault();
      }
    }

    function fetchPrayerTimesDefault() {
      fetch(`https://api.aladhan.com/v1/timingsByCity?city=Makkah&country=SaudiArabia&method=4`)
        .then(res => res.json())
        .then(data => {
          const times = data.data.timings;
          document.getElementById('fajr').textContent = times.Fajr;
          document.getElementById('sunrise').textContent = times.Sunrise;
          document.getElementById('dhuhr').textContent = times.Dhuhr;
          document.getElementById('asr').textContent = times.Asr;
          document.getElementById('maghrib').textContent = times.Maghrib;
          document.getElementById('isha').textContent = times.Isha;
        });
    }

    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
      localStorage.setItem('sirajna_theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
    }

    if (localStorage.getItem('sirajna_theme') === 'dark') document.body.classList.add('dark-mode');

    function toggleFavorite() {
      const btn = document.getElementById('favBtn');
      btn.classList.toggle('active');
      const isActive = btn.classList.contains('active');
      btn.querySelector('.icon').textContent = isActive ? '❤️' : '🤍';
      document.getElementById('favText').textContent = isActive ? 'في المفضلة' : 'المفضلة';
    }

    async function shareContent() {
      const shareData = { title: 'سراجنا', text: 'موقع سراجنا للقرآن الكريم والأذكار', url: window.location.href };
      if (navigator.share) {
        try { await navigator.share(shareData); } catch (e) {}
      } else {
        navigator.clipboard.writeText(window.location.href);
        alert('تم نسخ رابط الموقع!');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      updateAudio();
      updateAzkar();
      fetchPrayerTimes();
    });
  </script>
</body>
</html>
