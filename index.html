<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سراجنا</title>
  
  <style>
    /* 1. المتغيرات والتأسيس العام */
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #2c3e50;
      --accent-color: #007bc7;
      --accent-hover: #005a93;
      --border-color: #e0e0e0;
      --fav-color: #e74c3c;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }

    /* 2. تحسينات الوضع الداكن */
    body.dark-mode {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #e0e0e0;
      --accent-color: #64b5f6; /* لون أزرق فاتح مريح في الظلام */
      --accent-hover: #9be7ff;
      --border-color: #333333;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* تحسين شكل الروابط */
    a {
      color: var(--accent-color);
      text-decoration: none;
      font-weight: 600;
    }

    a:hover {
      color: var(--accent-hover);
      text-decoration: underline;
    }

    /* الهيدر وأزرار التحكم */
    header {
      width: 100%;
      max-width: 600px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--accent-color);
    }

    .top-controls {
      display: flex;
      gap: 10px;
    }

    .icon-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      box-shadow: var(--shadow);
    }

    /* كارت المحتوى */
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 25px;
      width: 100%;
      max-width: 600px;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .content-text {
      font-size: 1.4rem;
      line-height: 1.8;
      margin-bottom: 20px;
      font-weight: 500;
    }

    /* 3. مشغل الصوتيات */
    .audio-section {
      margin: 20px 0;
      width: 100%;
    }

    audio {
      width: 100%;
      border-radius: 30px;
      outline: none;
    }

    /* 4. شريط الأزرار (المفضلة والمشاركة) */
    .action-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 20px;
    }

    .action-btn {
      padding: 10px 20px;
      border: 1px solid var(--border-color);
      border-radius: 25px;
      background: transparent;
      color: var(--text-color);
      cursor: pointer;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .action-btn:hover {
      border-color: var(--accent-color);
    }

    /* تغيير شكل زر المفضلة المفعل */
    .fav-btn.active {
      color: var(--fav-color);
      border-color: var(--fav-color);
      background-color: rgba(231, 76, 60, 0.08);
    }

    /* الفوتر */
    footer {
      margin-top: auto;
      padding-top: 30px;
      font-size: 0.9rem;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <!-- الهيدر -->
  <header>
    <div class="logo">سراجنا</div>
    <div class="top-controls">
      <!-- زر التبديل للوضع الداكن -->
      <button class="icon-btn" onclick="toggleDarkMode()">🌙 الوضع</button>
    </div>
  </header>

  <!-- الكارت الرئيسي للمحتوى -->
  <main class="card">
    
    <!-- نص الذكر أو الآية -->
    <div class="content-text" id="contentText">
      "اللَّهُ لاَ إِلَهَ إِلاَّ هُوَ الْحَيُّ الْقَيُّومُ لاَ تَأْخُذُهُ سِنَةٌ وَلاَ نَوْمٌ"
    </div>

    <!-- نظام الصوتيات -->
    <div class="audio-section">
      <audio id="audioPlayer" controls>
        <source src="https://server8.mp3quran.net/afs/002255.mp3" type="audio/mpeg">
        متصفحك لا يدعم مشغل الصوتيات.
      </audio>
    </div>

    <!-- شريط أزرار المفضلة والمشاركة -->
    <div class="action-buttons">
      
      <!-- زر المفضلة -->
      <button id="favBtn" class="action-btn fav-btn" onclick="toggleFavorite()">
        <span class="icon">🤍</span> <span id="favText">المفضلة</span>
      </button>

      <!-- زر المشاركة -->
      <button class="action-btn share-btn" onclick="shareContent()">
        <span class="icon">📤</span> مشاركة
      </button>

    </div>

  </main>

  <!-- الفوتر مع رابط المحتوى -->
  <footer>
    تم التطوير بـ ❤️ | <a href="https://github.com" target="_blank">رابط المشروع</a>
  </footer>

  <!-- البرمجة والتفاعل (JavaScript) -->
  <script>
    // 1. نظام الوضع الداكن (Dark Mode)
    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      localStorage.setItem('sirajna_theme', isDark ? 'dark' : 'light');
    }

    // استعادة وضع الإضاءة المفضل للمستخدم عند التحميل
    if (localStorage.getItem('sirajna_theme') === 'dark') {
      document.body.classList.add('dark-mode');
    }

    // 2. نظام المفضلة (Favorites)
    const itemID = "ayat_alkursi"; // معرّف العنصر الحالي

    function checkFavoriteStatus() {
      let favorites = JSON.parse(localStorage.getItem('sirajna_favs')) || [];
      const favBtn = document.getElementById('favBtn');
      const favText = document.getElementById('favText');
      
      if (favorites.includes(itemID)) {
        favBtn.classList.add('active');
        favBtn.querySelector('.icon').textContent = '❤️';
        favText.textContent = 'في المفضلة';
      } else {
        favBtn.classList.remove('active');
        favBtn.querySelector('.icon').textContent = '🤍';
        favText.textContent = 'المفضلة';
      }
    }

    function toggleFavorite() {
      let favorites = JSON.parse(localStorage.getItem('sirajna_favs')) || [];
      const index = favorites.indexOf(itemID);

      if (index === -1) {
        favorites.push(itemID);
      } else {
        favorites.splice(index, 1);
      }

      localStorage.setItem('sirajna_favs', JSON.stringify(favorites));
      checkFavoriteStatus();
    }

    // 3. نظام المشاركة (Share API)
    async function shareContent() {
      const textToShare = document.getElementById('contentText').innerText;
      const shareData = {
        title: 'سراجنا',
        text: textToShare,
        url: window.location.href
      };

      if (navigator.share) {
        try {
          await navigator.share(shareData);
        } catch (err) {
          console.log('تم إلغاء المشاركة');
        }
      } else {
        // إذا كان المتصفح لا يدعم المشاركة المباشرة تقوم بالنسخ
        navigator.clipboard.writeText(`${textToShare}\n\nعبر موقع سراجنا:\n${window.location.href}`);
        alert('تم نسخ النص والرابط للحافظة بنجاح!');
      }
    }

    // تشغيل فحص المفضلة عند تحميل الصفحة مباشرة
    document.addEventListener('DOMContentLoaded', checkFavoriteStatus);
  </script>

</body>
</html>
