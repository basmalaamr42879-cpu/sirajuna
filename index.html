<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة سراجنا</title>
    <!-- خط أميري لللمسة الجمالية -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #fdfbf7;
            --text-color: #2c3e50;
            --card-bg: #ffffff;
            --primary-color: #1b4332;
            --accent-color: #d4af37;
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        body.dark-mode {
            --bg-color: #12181b;
            --text-color: #e0e6ed;
            --card-bg: #1e272e;
            --primary-color: #2d6a4f;
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--accent-color);
        }

        h1 {
            font-family: 'Amiri', serif;
            color: var(--primary-color);
            font-size: 2.2rem;
        }

        body.dark-mode h1 {
            color: var(--accent-color);
        }

        .theme-btn {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        /* كارت الذكر اليومي */
        .quote-box {
            font-family: 'Amiri', serif;
            font-size: 1.5rem;
            margin: 20px 0;
            min-height: 60px;
            color: var(--primary-color);
        }

        body.dark-mode .quote-box {
            color: #f1f2f6;
        }

        .btn-action {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
        }

        /* جدول مواقيت الصلاة */
        .prayer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 12px;
            margin-top: 15px;
        }

        .prayer-item {
            background-color: var(--bg-color);
            padding: 12px;
            border-radius: 8px;
            border-top: 3px solid var(--accent-color);
        }

        .prayer-name {
            font-size: 0.9rem;
            margin-bottom: 5px;
            opacity: 0.8;
        }

        .prayer-time {
            font-size: 1.2rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>سراجنا</h1>
        <button class="theme-btn" id="theme-btn">الوضع الليلي 🌙</button>
    </header>

    <main class="container">
        
        <!-- قسم ذكر اليوم -->
        <section class="card">
            <h2>ذكر اليوم</h2>
            <div class="quote-box" id="daily-quote">جاري التحميل...</div>
            <button class="btn-action" onclick="getRandomQuote()">ذكر آخر 🔄</button>
        </section>

        <!-- قسم مواقيت الصلاة -->
        <section class="card">
            <h2>مواقيت الصلاة اليوم (القاهرة)</h2>
            <div class="prayer-grid">
                <div class="prayer-item">
                    <div class="prayer-name">الفجر</div>
                    <div class="prayer-time" id="fajr">--:--</div>
                </div>
                <div class="prayer-item">
                    <div class="prayer-name">الظهر</div>
                    <div class="prayer-time" id="dhuhr">--:--</div>
                </div>
                <div class="prayer-item">
                    <div class="prayer-name">العصر</div>
                    <div class="prayer-time" id="asr">--:--</div>
                </div>
                <div class="prayer-item">
                    <div class="prayer-name">المغرب</div>
                    <div class="prayer-time" id="maghrib">--:--</div>
                </div>
                <div class="prayer-item">
                    <div class="prayer-name">العشاء</div>
                    <div class="prayer-time" id="isha">--:--</div>
                </div>
            </div>
        </section>

    </main>

    <script>
        // 1. الأذكار والآيات
        const quotes = [
            "لا إله إلا أنت سبحانك إني كنت من الظالمين",
            "الحمد لله الذي بنعمته تتم الصالحات",
            "اللهم صلّ وسلم على نبينا محمد",
            "إن مع العسر يسراً",
            "سبحان الله وبحمده، سبحان الله العظيم",
            "ألا بذكر الله تطمئن القلوب"
        ];

        function getRandomQuote() {
            const randomIndex = Math.floor(Math.random() * quotes.length);
            document.getElementById('daily-quote').innerText = quotes[randomIndex];
        }

        // 2. الوضع الليلي (Dark Mode)
        const themeBtn = document.getElementById('theme-btn');
        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            if (document.body.classList.contains('dark-mode')) {
                themeBtn.innerText = 'الوضع الفاتح ☀️';
            } else {
                themeBtn.innerText = 'الوضع الليلي 🌙';
            }
        });

        // 3. جلب مواقيت الصلاة من الـ API
        async function getPrayerTimes() {
            try {
                const response = await fetch('https://api.aladhan.com/v1/timingsByCity?city=Cairo&country=Egypt&method=5');
                const data = await response.json();
                const timings = data.data.timings;

                document.getElementById('fajr').innerText = timings.Fajr;
                document.getElementById('dhuhr').innerText = timings.Dhuhr;
                document.getElementById('asr').innerText = timings.Asr;
                document.getElementById('maghrib').innerText = timings.Maghrib;
                document.getElementById('isha').innerText = timings.Isha;
            } catch (error) {
                console.error("خطأ في جلب مواقيت الصلاة:", error);
            }
        }

        // تشغيل الوظائف عند تحميل الصفحة
        document.addEventListener('DOMContentLoaded', () => {
            getRandomQuote();
            getPrayerTimes();
        });
    </script>
</body>
</html>
